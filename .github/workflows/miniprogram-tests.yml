name: Mini Program Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find miniprogram tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run mini program tests
        run: node --test tests/*.test.js tests/test_*.js
